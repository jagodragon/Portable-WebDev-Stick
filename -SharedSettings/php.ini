; ====================================================================
; 🚀 SharedSettings/php.ini - Portable JIT Execution Matrix
; ====================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1

; Resource Optimization Limits
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

; Error Reporting Frameworks
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On
display_startup_errors = On
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On

; Core Data Variables
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 32M
default_mimetype = "text/html"
default_charset = "UTF-8"

; ====================================================================
; 🔌 FastCGI Path Resolution Matrix (section added to make windows happy)
; ====================================================================
cgi.fix_pathinfo = 0
cgi.force_redirect = 0

; ====================================================================
; 🧠 High-Performance OPcache & JIT Compiler Engine
; ====================================================================
[opcache]
; These two lines are the official keys to wake up the compiled-in static module code!
opcache.enable = 1
opcache.enable_cli = 1

; Buffer structures managed entirely in shared system RAM sectors
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000

; Automated background change validation
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; JIT Optimization Flags
opcache.jit = 1255
opcache.jit_buffer_size = 32M

; ====================================================================
; 🔌 Dynamic Database Extensions Matrix
; ====================================================================
; Portable relative extension directory (works on both Windows and Linux)
extension_dir = "ext"

; Standard shorthand (PHP loads .dll on Windows and .so on Linux automatically)
extension=pdo_mysql
extension=mysqli