# Ports.Default.conf - Portable WebDev Stick
# ---------------------------------------------------------------------------
# The declared default ports for every server in the stack, and the ranges
# the port decider is allowed to hunt in when a default is already taken.
#
# This file is configuration, not code: edit it by hand if you know your
# machine. Nothing in the kit ever writes to it.
#
# Every start/stop script resolves each port in this order:
#   1. the environment variable WEBDEV_PORT_<KEY>   (e.g. WEBDEV_PORT_WEB)
#   2. Ports.InUse.conf, section [InUsePorts]       (written by the decider)
#   3. this file, section [DefaultPorts]
#
# [DefaultPorts]  - the single port each service should use.
# [DefaultRanges] - only a.Ports.FixConflicts reads these. When a default
#                   port is occupied, the decider scans the range in order
#                   and records the first free port in Ports.InUse.conf.
#                   a.Ports.UseDefaults deletes Ports.InUse.conf, which
#                   returns every script to the values below.
# The two sections are independent: a default does not have to sit inside
# its range. The default is always tried first.
# ---------------------------------------------------------------------------

[DefaultPorts]
WEB=8080
MARIADB=3306
REDIS=6379
FPM=9000
NODE=3000

[DefaultRanges]
WEB=8080-8084
MARIADB=3306-3310
REDIS=6379-6383
FPM=9000-9004
NODE=3000-3004
