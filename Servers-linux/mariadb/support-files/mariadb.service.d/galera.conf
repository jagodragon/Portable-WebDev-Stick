# This is a drop-in for the mariadb.service to
# extend its functionality for Galera.
#
# ExecStart overrides the base service, the other
# lists, like ExecStartPre, end the previous lists.
[Service]

# Use an environment file to pass variable _WSREP_NEW_CLUSTER.
# Must not be writable by mysql user.
EnvironmentFile=-/tmp/mariadb-wsrep-new-cluster

# Reset of ExecStart list from base service
ExecStart=
# Start main service
# _WSREP_NEW_CLUSTER is for the exclusive use of the script galera_new_cluster
#
# Perform automatic wsrep recovery. When server is started without wsrep,
# galera_recovery simply returns an empty string. In any case, however, it is
# not expected to return a non-zero status.
# Do not panic if galera_recovery script is not available. (MDEV-10538)
ExecStart=/bin/sh -c "set -f; [ ! -e /usr/local/mysql/bin/galera_recovery ] && VAR= || \
 VAR=`/usr/local/mysql/bin/galera_recovery`; [ $? -eq 0 ] || exit 1; \
 exec /usr/local/mysql/bin/mariadbd $MYSQLD_OPTS $_WSREP_NEW_CLUSTER $VAR"

# have to set the name explicitly now, otherwise it'll be the
# first name from ExecStart
SyslogIdentifier=mariadbd
